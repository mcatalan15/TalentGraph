name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # do not stop if one test fails
      matrix:
        app:
          - api
          - client
          # - postgresql

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: containers/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: containers/${{ matrix.app }}
        run: npm install

      - name: Run ESLint
        working-directory: containers/${{ matrix.app }}
        run: npm run lint


  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lint

    env:
      API_KEY: ${{ secrets.API_KEY }}
      API_UID: ${{ secrets.API_UID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: containers/api/package-lock.json


      - name: Install dependencies
        run: npm install
        working-directory: containers/api

      - name: Start server and check health
        working-directory: containers/api
        env:
          NODE_ENV: production
        run: |
          npm run start &
          SERVER_PID=$!
          
          # Attendre que le port soit disponible
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/api/health && break
            echo "Attempt $i/15 — waiting..."
            sleep 2
          done
          
          # Vérification finale
          curl   --fail http://localhost:3000/api/health
          
          # Cleanup
          kill $SERVER_PID

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: containers/client/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: containers/client

      - name: Build
        run: npm run build # build production code
        working-directory: containers/client

