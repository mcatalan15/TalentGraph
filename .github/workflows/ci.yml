name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # do not stop if one test fails
      matrix:
        app:
          - api
          - client
          # - postgresql

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: containers/${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: containers/${{ matrix.app }}
        run: npm ci

      - name: Run ESLint
        working-directory: containers/${{ matrix.app }}
        run: npm run lint


  build-api:
    name: Build API
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: containers/api/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: containers/api

      - name: Build
        run: npm run start & # build production code
        working-directory: containers/api

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Test health endpoint
        run: curl -f http://localhost:3000/health || exit 1
        working-directory: containers/api

  build-client:
    name: Build client
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: containers/client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: containers/client

      - name: Build
        run: npm run build # build production code
        working-directory: containers/client

  smart-contracts:
    name: Test smart contracts
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    strategy:
      matrix:
        app:
          - api
          - client
          # - postgresql
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: containers/${{ matrix.app }}
        run: npm ci

      - name: Test smart contracts
        working-directory: containers/${{ matrix.app }}
        run: npm run test:contracts
